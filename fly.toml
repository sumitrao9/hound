app = "hound-mcp"
primary_region = "iad"

[build]

[env]
  HOUND_HEADLESS = "1"
  HOUND_HOST = "0.0.0.0"
  HOUND_PORT = "8000"
  HOUND_METER_DB = "/data/hound-meter.db"
  HOUND_DB = "/data/hound-selectors.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "hound_data"
  destination = "/data"

[[checks]]
  port = 8000
  type = "http"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"
