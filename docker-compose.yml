services:
  hound-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      HOUND_HEADLESS: "1"
      HOUND_DEFAULT_BUDGET: "1200"
      HOUND_MAX_BUDGET: "20000"
      HOUND_ADMIN_KEY: ${HOUND_ADMIN_KEY:-}
      HOUND_METER_DB: /data/hound-meter.db
      HOUND_DB: /data/hound-selectors.db
    volumes:
      - hound-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  hound-data:
