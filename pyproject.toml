[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hound-browser-mcp"
version = "0.1.0"
description = "Token-budgeted, self-healing browser automation MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sumit Yadav" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "browser-automation",
    "playwright",
    "ai-agents",
    "token-optimization",
    "accessibility-tree",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.0",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
hound-mcp = "hound.mcp.server:main"
hound-bench = "bench.run:cli"

[project.urls]
Homepage = "https://github.com/sumitrao9/hound"
Repository = "https://github.com/sumitrao9/hound"
Issues = "https://github.com/sumitrao9/hound/issues"
Benchmark = "https://github.com/sumitrao9/hound/blob/main/docs/benchmark.html"

[tool.setuptools.packages.find]
include = ["hound*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: marks tests that require a live browser and network",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "RET", "SIM"]
ignore = ["S101"]


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "hound.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytest.*"
ignore_missing_imports = true
